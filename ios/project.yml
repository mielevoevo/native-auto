# XcodeGen spec: `cd ios && xcodegen` writes NativeAuto.xcodeproj (git-ignored; never edit it by hand).
name: NativeAuto
options:
  bundleIdPrefix: com.mielevoevo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # 15c: map + navigation (no API keys). Ferrostar matches Android's 0.59; MapLibre 6.31.0 is what Ferrostar 0.59's
  # own MapLibre dependency resolves to. Exact pins: the resolved file lives in the git-ignored .xcodeproj.
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: "6.31.0"
  Ferrostar:
    url: https://github.com/stadiamaps/ferrostar
    exactVersion: "0.59.0"

configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.5"        # iOS line: 0.x until it matches the Android app, then 1.0
    CURRENT_PROJECT_VERSION: "5"    # +1 per sub-phase build

targets:
  NativeAuto:
    type: application
    platform: iOS
    sources: [NativeAuto, Shared]
    dependencies:
      - target: ShareExtension
      - package: MapLibre
      - package: Ferrostar
        product: FerrostarCore
    info:
      path: NativeAuto/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Geist (Vercel, OFL), the same TTFs as the Android app (res/font).
        UIAppFonts: [geist_regular.ttf, geist_medium.ttf, geist_semibold.ttf, geist_bold.ttf]
        # 15c: `geo:` links and `nativeauto://open?text=…` (a Shortcut or a later share extension) open a destination.
        CFBundleURLTypes:
          - CFBundleURLName: com.mielevoevo.nativeauto.links
            CFBundleURLSchemes: [geo, nativeauto]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mielevoevo.nativeauto
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Native Auto
        INFOPLIST_KEY_NSAppleMusicUsageDescription: Native Auto shows the Apple Music track on the media card.
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: Native Auto shows your speed and records your trips while the app is open.
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UIStatusBarHidden: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  # 15e: "Native Auto" in the share sheet (a place from Google Maps → the app's link resolver).
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension, Shared]
    info:
      path: ShareExtension/Info.plist
      properties:
        CFBundleDisplayName: Native Auto
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mielevoevo.nativeauto.share
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES

  NativeAutoTests:
    type: bundle.unit-test
    platform: iOS
    sources: [NativeAutoTests]
    dependencies:
      - target: NativeAuto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mielevoevo.nativeauto.tests

  NativeAutoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [NativeAutoUITests]
    dependencies:
      - target: NativeAuto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mielevoevo.nativeauto.uitests
        TEST_TARGET_NAME: NativeAuto

schemes:
  NativeAuto:
    build:
      targets:
        NativeAuto: all
        NativeAutoTests: [test]
        NativeAutoUITests: [test]
    test:
      targets: [NativeAutoTests, NativeAutoUITests]
